dsl: "TwinDSL/v0.1"

system:
  id: SYS-SMALL-EVTOL-LIFT-CRUISE
  name: "Small Lift+Cruise UAV"
  domain: ["aerospace", "evtol"]
  description: "Lift+cruise eVTOL with wing-borne cruise and distributed lift."

provenance:
  prompt:
    - "Design small lift+cruise eVTOL UAV that minimizes mission energy and time."
  sources:
    - type: "user"
      ref: "chat:turn_123"

units:
  default_system: SI

libraries:
  - "libraries/aerospace/components"
  - "libraries/aerospace/models"

requirements:
  - id: REQ-CONSTRAINTS-TAS-001
    statement: "Aircraft cruise TAS shall be greater than or equal to 10 m/s and less than or equal to 30 m/s"
    severity: must
    verify:
      method: analysis
      model: small_UAV_eVTOL_MOO.py
      check: "10 m/s <= V_cruise <= 30 m/s"

  - id: REQ-CONSTRAINTS-TAS-002
    statement: "Aircraft climb TAS shall be greater than or equal to 10 m/s and less than or equal to 30 m/s"
    severity: must
    verify:
      method: analysis
      model: small_UAV_eVTOL_MOO.py
      check: "10 m/s <= V_climb <= 30 m/s"
  
  - id: REQ-CONSTRAINTS-TAS-003
    statement: "Aircraft stall margin shall be greater than or equal to 10 m/s"
    severity: must
    verify:
      method: analysis
      model: small_UAV_eVTOL_MOO.py
      check: "(V_cruise - V_stall) >= 10 m/s "

  - id: REQ-CONSTRAINTS-MTOM-001
    statement: "Aircraft MTOM shall be greater than or equal to 0.5 kg and less than or equal to 2.5 kg"
    severity: must
    verify:
      method: analysis
      model: small_UAV_eVTOL_MOO.py
      check: "0.5 <= MTOM <= 2.5"
  
  - id: REQ-CONSTRAINTS-WING-001
    statement: "Aircraft wing span shall be less than 2.5 m"
    severity: must
    verify:
      method: analysis
      model: small_UAV_eVTOL_MOO.py
      check: "b_wing <= 2.5"
  
  - id: REQ-PERF-UAV-001
    statement: "Aircraft shall have a minimum cruise range of 50 km"
    severity: must
    verify:
      method: analysis
      model: small_UAV_eVTOL_MOO.py
      check: "50 km <= Range_cruise"

  - id: REQ-PERF-UAV-002
    statement: "Aircraft shall have a minimum hover time of 5 minutes"
    severity: must
    verify:
      method: analysis
      model: small_UAV_eVTOL_MOO.py
      check: "5 minutes <= t_hover"
  

parameters:
  # Global design variables / constants
  V_cruise: {type: float, kind: optimization variable, units: m/s, bounds: [10, 30]}
  V_climb: {type: float, kind: optimization variable, units: m/s,  bounds: [10, 30]}
  stall_margin : {type: float, kind: known variable, value: 10}
  V_stall: {type: float, kind: computed variable, units: m/s}
  MTOM: {type: float, kind: optimization variable, units: kg,  bounds: [0.5, 2.5]}
  CL_cruise: {type: float, kind: computed variable}
  CD_cruise: {type: float, kind: computed variable}
  CL_over_CD_cruise: {type: float, kind: computed variable}
  Range_cruise: {type: float, kind: known variable, units: km, value: 50}
  CD0: {type: float, kind: known variable, value: 0.020}
  CL_max: {type: float, kind: known variable, value: 1.5}
  t_hover: {type: float, kind: known variable, units: min, value: 5}
  disk_loading: {type: float, kind: computed variable, units: N/m^2}
  P_hover: {type: float, kind: computed variable, units: W}
  P_cruise: {type: float, kind: computed variable, units: W}
  P_climb : {type: float, kind: computed variable, units: W}
  tol_mass_kg: {type: float, kind: known variable, units: kg, value: 0.01}


