dsl: "TwinDSL/v0.1"

system:
  id: SYS-SMALL-EVTOL-LIFT-CRUISE
  name: "Small Lift+Cruise UAV"
  domain: ["aerospace", "evtol"]
  description: "Lift+cruise eVTOL with wing-borne cruise and distributed lift."

provenance:
  prompt:
    - "Design small GH2 lift+cruise eVTOL UAV that minimizes mission energy and time."
  sources:
    - type: "user"
      ref: "chat:turn_123"

units:
  default_system: SI

libraries:
  - "libraries/aerospace/models"

design_requirements:
  path: "examples/small_UAV_lift_cruise/UAV Design Iterations.xlsx"
  sheet: "UAV Design Requirements"

requirements:
  - id: MISSION-001
    component: MISSION
    statement: "Total hover time of the UAV shall be 10 minutes"
    rationale: "It is assumed that the hover mission portion accounts for the total energy required for vertical climb, transition, hover, multirotor horizontal flight, and vertical descent. Total energy for hover is computed using the hover power required."
    parameter: t_hover
    parameter_kind: known
    value: 10
    verification_method: MOO


components:
  - id: MISSION
    type: mission.profile
    parameters:
      t_hover: {type: float, kind: known variable, units: min, value: 10}
      range_cruise: {type: float, kind: known variable, units: km, value: 550}
      b_cruise: {type: float, kind: known variable, value: 1}
      b_climb: {type: float, kind: known variable, value: 1}
      h_cruise: {type: float, kind: known variable, units: m, value: 3000.0}
      h_climb_start: {type: float, kind: known variable, units: m, value: 100.0}
      h_hover: {type: float, kind: known variable, units: m, value: 100.0}
      theta_climb: {type: float, kind: known variable, units: deg, value: 10}
      g: {type: float, kind: known variable, units: m/s^2, value: 9.81}
      hybrid_batt_factor_hover: {type: float, kind: known variable, value: 0.10}
      hybrid_batt_factor_cruise: {type: float, kind: known variable, value: 0.05}
      hybrid_batt_factor_climb: {type: float, kind: known variable, value: 0.10}
      vertical_climb_factor: {type: float, kind: known variable, value: 1.0}
      t_trip: {type: float, kind: computed variable, units: min}
      t_cruise: {type: float, kind: computed variable, units: min}
      t_climb: {type: float, kind: computed variable, units: min}
      e_trip: {type: float, kind: computed variable, units: Wh}

  - id: SYSTEM
    type: aerospace.Aircraft
    parameters:
      MTOM: {type: float, kind: optimization variable, units: kg, bounds: [1.0, 25.0]}
      MTOM_bounds: {type: list, kind: known variable, units: kg, value: [1.0, 25.0]}
      V_cruise: {type: float, kind: optimization variable, units: m/s, bounds: [15.0, 28.0]}
      V_cruise_bounds: {type: list, kind: known variable, units: m/s, value: [15.0, 28.0]}
      V_climb: {type: float, kind: optimization variable, units: m/s, bounds: [15.0, 28.0]}
      V_climb_bounds: {type: list, kind: known variable, units: m/s, value: [15.0, 28.0]}
      stall_margin: {type: float, kind: known variable, units: m/s, value: 5.0}
      V_stall: {type: float, kind: computed variable, units: m/s}
      CD0: {type: float, kind: known variable, value: 0.025}
      CL_max: {type: float, kind: known variable, value: 1.6}
      CL_cruise: {type: float, kind: computed variable}
      CD_cruise: {type: float, kind: computed variable}
      LD_cruise: {type: float, kind: computed variable}
      l_max: {type: float, kind: known variable, units: m, value: 1.8}
      P_hover: {type: float, kind: computed variable, units: W}
      P_cruise: {type: float, kind: computed variable, units: W}
      P_climb: {type: float, kind: computed variable, units: W}
      energy_stored_onboard: {type: float, kind: computed variable, units: Wh}
      wing_loading: {type: float, kind: computed variable, units: N/m^2}
      disk_loading: {type: float, kind: computed variable, units: N/m^2}
      tol_mass_kg: {type: float, kind: known variable, units: kg, value: 0.05}
      max_length: {type: float, kind: computed variable, units: m}

  - id: MAIN_WING
    type: airframe.main_wing
    parameters:
      S_wing: {type: float, kind: optimization variable, units: m^2, bounds: [0.35, 20.0]}
      S_wing_bounds: {type: list, kind: known variable, units: m^2, value: [0.35, 20.0]}
      AR_wing: {type: float, kind: optimization variable, bounds: [6.0, 9.0]}
      AR_wing_bounds: {type: list, kind: known variable, value: [6.0, 9.0]}
      theta_wing: {type: float, kind: known variable, units: deg, value: 1}
      taper_ratio_wing: {type: float, kind: known variable, value: 0.8}
      t_over_c_wing: {type: float, kind: known variable, value: 0.12}
      e_wing: {type: float, kind: known variable, value: 0.85}
      x_loc_wing: {type: float, kind: known variable, units: m, value: 0}
      y_loc_wing: {type: float, kind: known variable, units: m, value: 0}
      z_loc_wing: {type: float, kind: known variable, units: m, value: 0}
      x_rot_wing: {type: float, kind: known variable, units: deg, value: 0}
      y_rot_wing: {type: float, kind: known variable, units: deg, value: 0}
      z_rot_wing: {type: float, kind: known variable, units: deg, value: 0}
      root_ThickChord_wing: {type: float, kind: known variable, value: 0.1}
      root_Camber_wing: {type: float, kind: known variable, value: 0.04}
      root_CamberLoc_wing: {type: float, kind: known variable, value: 0.4}
      tip_ThickChord_wing: {type: float, kind: known variable, value: 0.1}
      tip_Camber_wing: {type: float, kind: known variable, value: 0.04}
      tip_CamberLoc_wing: {type: float, kind: known variable, value: 0.4}
      b_wing: {type: float, kind: optimization variable, units: m, bounds: [0.0, 2.5]}
      b_wing_bounds: {type: list, kind: known variable, units: m, value: [0.0, 2.5]}
      aileron_hinge: {type: float, kind: known variable, value: 0.2}
      aileron_start: {type: float, kind: known variable, value: 0.5}
      aileron_end: {type: float, kind: known variable, value: 0.9}

  - id: TAIL
    type: airframe.h_stab
    parameters:
      static_margin_hstab: {type: float, kind: known variable, value: 0.25}
      eta_t_hstab: {type: float, kind: known variable, value: 0.9}
      c_HT: {type: float, kind: known variable, value: 0.45}
      AR_hstab: {type: float, kind: known variable, value: 4}
      taper_ratio_hstab: {type: float, kind: known variable, value: 0.9}
      theta_hstab: {type: float, kind: known variable, units: deg, value: 12}
      tail_z_loc: {type: float, kind: known variable, units: m, value: 0.14}
      z_loc_hstab: {type: float, kind: known variable, units: m, value: 0}
      x_rot_hstab: {type: float, kind: known variable, units: deg, value: 45}
      y_rot_hstab: {type: float, kind: known variable, units: deg, value: 0}
      z_rot_hstab: {type: float, kind: known variable, units: deg, value: 0}
      root_ThickChord_hstab: {type: float, kind: known variable, value: 0.1}
      root_Camber_hstab: {type: float, kind: known variable, value: 0.04}
      root_CamberLoc_hstab: {type: float, kind: known variable, value: 0.4}
      tip_ThickChord_hstab: {type: float, kind: known variable, value: 0.1}
      tip_Camber_hstab: {type: float, kind: known variable, value: 0.04}
      tip_CamberLoc_hstab: {type: float, kind: known variable, value: 0.4}
      elevator_hinge: {type: float, kind: known variable, value: 0.2}
      elevator_start: {type: float, kind: known variable, value: 0.1}
      elevator_end: {type: float, kind: known variable, value: 0.9}
      ctrl_hinge_hstab: {type: float, kind: known variable, value: 0.3}
      ctrl_start_hstab: {type: float, kind: known variable, value: 0.4}
      ctrl_end_hstab: {type: float, kind: known variable, value: 0.9}
      S_hstab: {type: float, kind: computed variable, units: m^2}
      c_hstab: {type: float, kind: computed variable}
      tail_rotor_clearance: {type: float, kind: known variable, value: 0.05}

  - id: FUSELAGE
    type: airframe.fuselage
    parameters:
      fuselage_l: {type: float, kind: computed variable, units: m}
      fuselage_w: {type: float, kind: computed variable, units: m}
      tank_l: {type: float, kind: computed variable, units: m}
      tank_w: {type: float, kind: computed variable, units: m}
      motor_mount_extension: {type: float, kind: known variable, units: m, value: 0.01}
      hover_rotor_clearance: {type: float, kind: known variable, units: m, value: 0.01}
      fuselage_y_loc: {type: float, kind: known variable, units: m, value: 0}
      fuselage_x_loc: {type: float, kind: computed variable}
      fuselage_z_loc: {type: float, kind: computed variable}
      fuselage_XSec_0_XLoc: {type: float, kind: known variable, value: 0.0}
      fuselage_XSec_1_XLoc: {type: float, kind: known variable, value: 0.20}
      fuselage_XSec_2_XLoc: {type: float, kind: known variable, value: 0.85}
      fuselage_XSec_3_XLoc: {type: float, kind: known variable, value: 1.0}
      fuselage_XSec_0_ZLoc: {type: float, kind: known variable, value: 0.0}
      fuselage_XSec_1_ZLoc: {type: float, kind: known variable, value: 0.0}
      fuselage_XSec_2_ZLoc: {type: float, kind: known variable, value: 0.0}
      fuselage_XSec_3_ZLoc: {type: float, kind: known variable, value: 0.0}
      fuselage_XSec_0_w: {type: float, kind: known variable, units: m, value: 0.1}
      fuselage_XSec_1_w: {type: float, kind: known variable, units: m, value: 0.2}
      fuselage_XSec_2_w: {type: float, kind: known variable, units: m, value: 0.2}
      fuselage_XSec_3_w: {type: float, kind: known variable, units: m, value: 0.12}
      fuselage_XSec_0_h: {type: float, kind: known variable, units: m, value: 0.12}
      fuselage_XSec_1_h: {type: float, kind: known variable, units: m, value: 0.22}
      fuselage_XSec_2_h: {type: float, kind: known variable, units: m, value: 0.22}
      fuselage_XSec_3_h: {type: float, kind: known variable, units: m, value: 0.14}
    
  - id: BATTERY
    type: energy.battery_pack
    parameters: 
      product_link_battery: {type: string, kind: known variable, value: "https://www.f1depo.com/urun/4s-4200mah-40c-lipo-batarya-14-8v-pil?srsltid=AfmBOoo0iWpsCtFiueq0ELTyeQZFcxRrrTi3pnkyqKOCUSfEiQR0FI6t"}
      rho_battery: {type: float, kind: known variable, units: Wh/kg, value: 180}
      e_usable_battery: {type: float, kind: known variable, value: 0.85}
      mass_battery: {type: float, kind: computed variable, units: kg}
      energy_battery: {type: float, kind: computed variable, units: Wh}
      energy_battery_stored: {type: float, kind: computed variable, units: Wh}

  - id: GH2_TANK
    type: energy.mass_hydrogen
    parameters:
      gravimetric_index: {type: float, kind: known variable, value: 0.054}
      LHV_H2: {type: float, kind: known variable, units: Wh/kg, value: 33330}
      tank_AR: {type: float, kind: known variable, value: 3}
      Z_tank: {type: float, kind: known variable, value: 1.236}
      P_tank: {type: float, kind: known variable, units: Pa, value: 35000000}
      T_tank: {type: float, kind: known variable, units: K, value: 293}
      energy_h2_stored: {type: float, kind: computed variable, units: Wh}
      mass_hydrogen_fuel: {type: float, kind: computed variable, units: kg}
      mass_storage_system: {type: float, kind: computed variable, units: kg}
      volume_tank_L: {type: float, kind: computed variable, units: L}
      tank_l: {type: float, kind: computed variable, units: m}
      tank_d: {type: float, kind: computed variable, units: m}

  - id: FUEL_CELL
    type: energy.fuel_cell
    parameters:
      eta_fc: {type: float, kind: known variable, value: 0.50}
      rho_fc: {type: float, kind: known variable, units: W/kg, value: 800}
      P_fc: {type: float, kind: computed variable, units: W}
      mass_fuel_cell: {type: float, kind: computed variable, units: kg}

  - id: HOVER_BLDC
    type: power.bldc_motor
    parameters: 
      product_link_hover_bldc: {type: string, kind: known variable, value: ""}
      mass_hover_bldc_per_rotor: {type: float, kind: computed variable, units: kg}
      eta_elec_hover_bldc: {type: float, kind: known variable, value: 0.95}
      rho_motor_hover_bldc: {type: float, kind: known variable, units: W/kg, value: 3000.0}
      P_motor_hover_bldc: {type: float, kind: computed variable, units: W}

  - id: CRUISE_BLDC
    type: power.bldc_motor
    parameters: 
      product_link_cruise_bldc: {type: string, kind: known variable, value: ""}
      mass_cruise_bldc_per_rotor: {type: float, kind: computed variable, units: kg}
      eta_elec_cruise_bldc: {type: float, kind: known variable, value: 0.95}
      rho_motor_cruise_bldc: {type: float, kind: known variable, units: W/kg, value: 3000.0}
      P_motor_cruise_bldc: {type: float, kind: computed variable, units: W}
  
  - id: HOVER_PROPELLER
    type: propulsion.propeller
    parameters:
      num_rotors_hover_propeller: {type: float, kind: known variable, value: 4}
      radius_hover_propeller: {type: float, kind: optimization variable, units: m, bounds: [0.0508, 0.26]}
      radius_hover_propeller_bounds: {type: list, kind: known variable, units: m, value: [0.0508, 0.26]}
      eta_prop_hover_propeller: {type: float, kind: known variable, value: 0.75}

  - id: CRUISE_PROPELLER
    type: propulsion.propeller
    parameters:
      num_rotors_cruise_propeller: {type: float, kind: known variable, value: 1}
      radius_cruise_propeller: {type: float, kind: optimization variable, units: m, bounds: [0.0508, 0.23]}
      radius_cruise_propeller_bounds: {type: list, kind: known variable, units: m, value: [0.0508, 0.23]}
      eta_prop_cruise_propeller: {type: float, kind: known variable, value: 0.85}
      cruise_propeller_num_blades: {type: float, kind: known variable, value: 2}
      cruise_propeller_z_loc: {type: float, kind: computed variable, units: m}
      cruise_propeller_x_rot: {type: float, kind: known variable, units: deg, value: 0}
      cruise_propeller_y_rot: {type: float, kind: known variable, units: deg, value: 0}
      cruise_propeller_z_rot: {type: float, kind: known variable, units: deg, value: 0}
      cruise_propeller_offset: {type: float, kind: known variable, units: m, value: 0.04}

  - id: FRONT_RIGHT_PROPELLER
    type: propulsion.propeller
    parameters:
      fr_propeller_num_blades: {type: float, kind: known variable, value: 2}
      fr_propeller_z_loc: {type: float, kind: known variable, units: m, value: 0.04}
      fr_propeller_x_rot: {type: float, kind: known variable, units: deg, value: 45}
      fr_propeller_y_rot: {type: float, kind: known variable, units: deg, value: 0}
      fr_propeller_z_rot: {type: float, kind: known variable, units: deg, value: 90}

  - id: FRONT_LEFT_PROPELLER
    type: propulsion.propeller
    parameters:
      fl_propeller_num_blades: {type: float, kind: known variable, value: 2}
      fl_propeller_z_loc: {type: float, kind: known variable, units: m, value: 0.04}
      fl_propeller_x_rot: {type: float, kind: known variable, units: deg, value: 45}
      fl_propeller_y_rot: {type: float, kind: known variable, units: deg, value: 0}
      fl_propeller_z_rot: {type: float, kind: known variable, units: deg, value: 90}

  - id: BACK_RIGHT_PROPELLER
    type: propulsion.propeller
    parameters:
      br_propeller_num_blades: {type: float, kind: known variable, value: 2}
      br_propeller_z_loc: {type: float, kind: known variable, units: m, value: 0.04}
      br_propeller_x_rot: {type: float, kind: known variable, units: deg, value: 45}
      br_propeller_y_rot: {type: float, kind: known variable, units: deg, value: 0}
      br_propeller_z_rot: {type: float, kind: known variable, units: deg, value: 90}

  - id: BACK_LEFT_PROPELLER
    type: propulsion.propeller
    parameters:
      bl_propeller_num_blades: {type: float, kind: known variable, value: 2}
      bl_propeller_z_loc: {type: float, kind: known variable, units: m, value: 0.04}
      bl_propeller_x_rot: {type: float, kind: known variable, units: deg, value: 45}
      bl_propeller_y_rot: {type: float, kind: known variable, units: deg, value: 0}
      bl_propeller_z_rot: {type: float, kind: known variable, units: deg, value: 90}

  - id: PAYLOAD
    type: payload.item
    parameters:
      mass_payload: {type: float, kind: known variable, units: kg, value: 3}

  - id: FLIGHT_CONTROLLER
    type: avionics.flight_controller
    parameters:
      mass_flight_controller: {type: float, kind: known variable, units: kg, value: 0.073}

  - id: FLIGHT_COMPUTER
    type: avionics.flight_computer
    parameters:
      mass_flight_computer: {type: float, kind: known variable, units: kg, value: 0.080}

  - id: SERVO
    type: electronics.servos
    parameters:
      product_link_servo: {type: string, kind: known variable, value: ""}
      mass_servo: {type: float, kind: known variable, units: kg, value: 0.06}
      num_servo: {type: float, kind: known variable, value: 4}
      mass_servos: {type: float, kind: computed variable, units: kg}
   
  - id: AUXILLIARY
    type: electronics.auxilliary
    parameters:
      mass_auxilliary: {type: float, kind: known variable, units: kg, value: 0.5}

  - id: STRUCTURES
    type: electronics.auxilliary
    parameters:
      mass_structures_factor: {type: float, kind: known variable, value: 0.35}
      mass_structures: {type: float, kind: computed variable, units: kg}

  - id: CONFIGURATION
    type: aerospace.openvsp_configuration
    parameters:
      cg_xyz: {type: tuple, kind: computed variable}
      wings: {type: list, kind: computed variable}
      fuselages: {type: list, kind: computed variable}
      props: {type: list, kind: computed variable}

  - id: OPENVSP
    type: aerospace.openvsp_run
    parameters:
      vsp3_path: {type: string, kind: computed variable}
      geom_ids: {type: dict, kind: computed variable}
      reference: {type: dict, kind: computed variable}
      analysis: {type: dict, kind: computed variable}
      sweep_outputs: {type: dict, kind: computed variable}
      notes: {type: list, kind: computed variable}
      debug: {type: dict, kind: computed variable}

  - id: OPTIMIZATION
    type: optimization.run
    parameters:
      pop_size: {type: int, kind: known variable, value: 200}
      n_gen: {type: int, kind: known variable, value: 200}
      seed: {type: int, kind: known variable, value: 1}
      verbose: {type: bool, kind: known variable, value: true}
      plot_pareto: {type: bool, kind: known variable, value: false}
      pareto_plot_block: {type: bool, kind: known variable, value: false}
      status: {type: string, kind: computed variable}
      best_idx: {type: int, kind: computed variable}
      best_objectives: {type: dict, kind: computed variable}
      max_constraint_violation: {type: float, kind: computed variable}
      pareto_set_size: {type: int, kind: computed variable}
      pareto_X: {type: array, kind: computed variable}
      pareto_F: {type: array, kind: computed variable}
      pareto_plot_path: {type: string, kind: known variable, value: null}

  
models:
  - id: MOO
    type: "python"
    entrypoint: "libraries.aerospace.models.optimization.small_GH2_UAV_eVTOL_MOO:small_UAV_eVTOL_MOO"
    inputs:
      - MISSION.t_hover
      - MISSION.range_cruise
      - SYSTEM.CD0
      - SYSTEM.CL_max
      - SYSTEM.stall_margin
      - MAIN_WING.e_wing
      - SYSTEM.l_max
      - BATTERY.rho_battery
      - BATTERY.e_usable_battery
      - FUEL_CELL.eta_fc
      - FUEL_CELL.rho_fc
      - GH2_TANK.gravimetric_index
      - GH2_TANK.LHV_H2
      - GH2_TANK.tank_AR
      - GH2_TANK.Z_tank
      - GH2_TANK.P_tank
      - GH2_TANK.T_tank
      - HOVER_BLDC.eta_elec_hover_bldc
      - HOVER_BLDC.rho_motor_hover_bldc
      - HOVER_PROPELLER.num_rotors_hover_propeller
      - HOVER_PROPELLER.eta_prop_hover_propeller
      - CRUISE_BLDC.eta_elec_cruise_bldc
      - CRUISE_BLDC.rho_motor_cruise_bldc
      - CRUISE_PROPELLER.num_rotors_cruise_propeller
      - CRUISE_PROPELLER.eta_prop_cruise_propeller
      - MISSION.b_cruise
      - MISSION.b_climb
      - MISSION.h_cruise
      - MISSION.h_climb_start
      - MISSION.h_hover
      - MISSION.theta_climb
      - MISSION.hybrid_batt_factor_hover
      - MISSION.hybrid_batt_factor_cruise
      - MISSION.hybrid_batt_factor_climb
      - MISSION.g
      - MISSION.vertical_climb_factor
      - PAYLOAD.mass_payload
      - AUXILLIARY.mass_auxilliary
      - FLIGHT_CONTROLLER.mass_flight_controller
      - FLIGHT_COMPUTER.mass_flight_computer
      - SERVO.num_servo
      - SERVO.mass_servo
      - STRUCTURES.mass_structures_factor
      - SYSTEM.MTOM_bounds
      - SYSTEM.V_cruise_bounds
      - SYSTEM.V_climb_bounds
      - MAIN_WING.S_wing_bounds
      - MAIN_WING.AR_wing_bounds
      - CRUISE_PROPELLER.radius_cruise_propeller_bounds
      - HOVER_PROPELLER.radius_hover_propeller_bounds
      - MAIN_WING.b_wing_bounds
      - SYSTEM.tol_mass_kg
      - OPTIMIZATION.pop_size
      - OPTIMIZATION.n_gen
      - OPTIMIZATION.seed
      - OPTIMIZATION.verbose
      - OPTIMIZATION.plot_pareto
      - OPTIMIZATION.pareto_plot_path
      - OPTIMIZATION.pareto_plot_block
    outputs:
      - name: SYSTEM.MTOM
        units: kg
      - name: MAIN_WING.S_wing
        units: m^2
      - name: MAIN_WING.AR_wing
      - name: SYSTEM.wing_loading
        units: N/m^2
      - name: MAIN_WING.b_wing
        units: m
      - name: SYSTEM.V_cruise
        units: m/s
      - name: SYSTEM.V_climb
        units: m/s
      - name: SYSTEM.V_stall
        units: m/s
      - name: SYSTEM.LD_cruise
      - name: CRUISE_PROPELLER.radius_cruise_propeller
        units: m
      - name: HOVER_PROPELLER.radius_hover_propeller
        units: m
      - name: MISSION.t_trip
        units: minutes
      - name: MISSION.t_cruise
        units: minutes
      - name: MISSION.t_climb
        units: minutes
      - name: MISSION.e_trip
        units: Wh
      - name: SYSTEM.energy_stored_onboard
        units: Wh
      - name: BATTERY.energy_battery
        units: Wh
      - name: BATTERY.energy_battery_stored
        units: Wh
      - name: GH2_TANK.energy_h2_stored
        units: Wh
